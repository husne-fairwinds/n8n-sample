# Ingress + public webhook URL
# Chart routes /webhook/* (and form/MCP paths) to webhook-processor when enabled.
# Keep webhook.url on the same host as ingress.hosts unless you add custom routing.

webhook:
  enabled: true
  url: "https://n8n.example.com"
  timeout: 120000

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
  hosts:
    - host: n8n.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: n8n-tls
      hosts:
        - n8n.example.com
  webhookProcessor:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    tls:
      - secretName: n8n-tls
        hosts:
          - n8n.example.com
